repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks: [{id: ruff, args: [--fix]}, {id: ruff-format}]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - {id: check-added-large-files, args: ["--maxkb=5000"]}
      - {id: detect-private-key}
      - {id: end-of-file-fixer, exclude: '^(reports/|paper/tables/)'}  # generated output
      - {id: trailing-whitespace, exclude: '^(reports/|paper/tables/)'}
      - {id: check-yaml}
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks: [{id: nbstripout}]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '^(docs/TALIMAT\.md|reports/|paper/|data/|notebooks/)'
