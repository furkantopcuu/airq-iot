# Projector-friendly: light theme, high contrast, large fonts (see dashboard/app.py)
[theme]
base = "light"
primaryColor = "#0072B2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#000000"

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"   # the control panel has no login: never listen on the network
enableXsrfProtection = true
enableCORS = false
