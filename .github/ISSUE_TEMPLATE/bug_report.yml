name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: What did you run and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: How to reproduce, description: "Exact commands (for the demo: `python -m scripts.demo --smoke` output helps)."}
  - type: input
    id: env
    attributes: {label: Environment, placeholder: "OS, Python version, broker (Mosquitto / amqtt)"}
