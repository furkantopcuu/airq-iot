name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix: {os: [ubuntu-latest, windows-latest], python: ["3.11", "3.12"]}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}   # Ubuntu is informational, Windows is required
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not broker and not slow" --cov=airq --cov-report=term-missing
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pip install -e . mypy bandit
      - run: pre-commit run --all-files   # ruff, formatting, secrets scan, notebook outputs
      - run: mypy                         # the typed core listed in pyproject.toml
      - run: bandit -q -r src scripts -ll # static security analysis, medium severity and up
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true               # informational: advisories do not block a merge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
  notebooks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - if: ${{ hashFiles('notebooks/*.ipynb') != '' }}
        run: pip install -e ".[ml,dev]"
      - if: ${{ hashFiles('notebooks/*.ipynb') != '' }}
        run: AIRQ_FIXTURE=1 pytest --nbmake notebooks/ --nbmake-timeout=600
  broker-integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - if: ${{ hashFiles('src/airq/iot/broker.py') != '' }}
        run: pip install -r requirements.txt
      - if: ${{ hashFiles('src/airq/iot/broker.py') != '' }}
        run: pip install -e .
      - if: ${{ hashFiles('src/airq/iot/broker.py') != '' }}
        run: |
          python -m airq.iot.broker &
          sleep 3
          pytest -m broker -rf --tb=short --junitxml=broker-junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-junit
          path: broker-junit.xml
          if-no-files-found: ignore
